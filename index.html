<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligentné Nástenné Hodiny - Online Čas</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.4);
            --bg-color: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            opacity: 1;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        body.hide-ui .top-bar,
        body.hide-ui .bottom-bar {
            opacity: 0;
            pointer-events: none;
        }

        .location-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #aaa;
        }

        .location-info span {
            color: #fff;
            font-weight: 600;
        }

        .time-source-badge {
            font-size: 0.75rem;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button, select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
            outline: none;
        }

        button:hover, select:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        select option {
            background: #111;
            color: #fff;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-grow: 1;
            width: 100%;
        }

        .clock-container {
            font-family: 'Orbitron', sans-serif;
            font-size: 14vw;
            font-weight: 900;
            line-height: 1;
            color: var(--accent-color);
            text-shadow: 0 0 30px var(--accent-glow), 0 0 60px var(--accent-glow);
            letter-spacing: 2px;
            margin-bottom: 20px;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .seconds {
            font-size: 6vw;
            opacity: 0.7;
            vertical-align: super;
        }

        .date-container {
            font-size: 2rem;
            font-weight: 500;
            color: #ccc;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: capitalize;
        }

        .weather-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .weather-icon {
            font-size: 3rem;
        }

        .weather-details {
            text-align: left;
        }

        .temp {
            font-size: 2.2rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-color);
        }

        .condition {
            font-size: 0.95rem;
            color: #aaa;
        }

        .bottom-bar {
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        @media (max-width: 768px) {
            .clock-container { font-size: 18vw; }
            .seconds { font-size: 8vw; }
            .date-container { font-size: 1.2rem; }
            .top-bar { padding: 10px 15px; flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body id="body">

    <div class="top-bar">
        <div class="location-info">
            📍 <span>Bratislava - mesto</span>
            <div class="time-source-badge" id="timeBadge">🌐 NTP Internetový čas</div>
        </div>
        <div class="controls">
            <button id="refreshAll" title="Obnoviť čas a počasie">🔄 Obnoviť</button>
            <select id="colorPicker" onchange="changeColor(this.value)">
                <option value="#ffffff">Biela (Predvolená)</option>
                <option value="#3b82f6">Neónová Modrá</option>
                <option value="#10b981">Svetlá Zelená</option>
                <option value="#f59e0b">Jantárová</option>
                <option value="#ec4899">Ružová</option>
            </select>
            <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
    </div>

    <div class="main-container">
        <div class="clock-container" id="clock">
            00:00<span class="seconds" id="seconds">00</span>
        </div>
        <div class="date-container" id="date">
            Načítavam dátum...
        </div>

        <div class="weather-card">
            <div class="weather-icon" id="wIcon">🌡️</div>
            <div class="weather-details">
                <div class="temp" id="wTemp">--°C</div>
                <div class="condition" id="wDesc">Načítavam počasie...</div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        Online NTP čas + Open-Meteo počasie
    </div>

    <script>
        const LAT = 48.1486;
        const LON = 17.1077;

        let timeOffset = 0; // Rozdiel medzi internetovým časom a zariadením

        // Sťahovanie presného času zo zabezpečeného internetového API (World Time API cez HTTPS)
        async function fetchNetworkTime() {
            try {
                const response = await fetch('https://worldtimeapi.org/api/timezone/Europe/Bratislava');
                if (!response.ok) throw new Error('Chyba servera');
                
                const data = await response.json();
                const serverTimeMs = data.unixtime * 1000;
                const localTimeMs = new Date().getTime();
                
                // Vypočítame korekciu, aby hodiny presne sedeli s internetovým časom
                timeOffset = serverTimeMs - localTimeMs;
                
                document.getElementById('timeBadge').textContent = "🌐 NTP Internetový čas";
                document.getElementById('timeBadge.style.color = '#10b981';
            } catch (error) {
                console.warn("Nepodarilo sa načítať internetový čas, používam záložný čas.", error);
                document.getElementById('timeBadge').textContent = "⚠️ Lokálny čas (Záloha)";
                document.getElementById('timeBadge').style.color = '#f59e0b';
            }
        }

        // Plynulý beh hodín každú sekundu
        function updateClock() {
            // Aktuálny čas zariadenia + vypočítaná korekcia z internetu
            const correctedDate = new Date(new Date().getTime() + timeOffset);
            
            let hours = String(correctedDate.getHours()).padStart(2, '0');
            let minutes = String(correctedDate.getMinutes()).padStart(2, '0');
            let seconds = String(correctedDate.getSeconds()).padStart(2, '0');

            document.getElementById('clock').innerHTML = `${hours}:${minutes}<span class="seconds">${seconds}</span>`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = correctedDate.toLocaleDateString('sk-SK', options);
        }

        // Načítaj internetový čas pri štarte
        fetchNetworkTime();
        // A pre istotu ho preveruj každých 5 minút, aby sa čas nerozchádzal
        setInterval(fetchNetworkTime, 5 * 60 * 1000);

        setInterval(updateClock, 1000);
        updateClock();

        // Počasie z Open-Meteo pre Bratislavu
        async function fetchWeather() {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Europe/Bratislava`);
                if (!response.ok) throw new Error('Chyba siete');
                
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const humidity = data.current.relative_humidity_2m;
                const code = data.current.weather_code;

                document.getElementById('wTemp').textContent = `${temp}°C`;
                
                let desc = "Jasno";
                let icon = "☀️";
                
                if (code >= 1 && code <= 3) { desc = "Polooblačno až oblačno"; icon = "⛅"; }
                else if (code >= 45 && code <= 48) { desc = "Hmla"; icon = "🌫️"; }
                else if (code >= 51 && code <= 67) { desc = "Dážď / Prehánky"; icon = "🌧️"; }
                else if (code >= 71 && code <= 77) { desc = "Sneh"; icon = "❄️"; }
                else if (code >= 95) { desc = "Búrka"; icon = "⛈️"; }

                document.getElementById('wDesc').textContent = `${desc} (Vlhkosť: ${humidity}%)`;
                document.getElementById('wIcon').textContent = icon;
            } catch (error) {
                console.error("Chyba pri načítaní počasia:", error);
                document.getElementById('wDesc').textContent = "Nepodarilo sa načítať počasie";
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 10 * 60 * 1000);

        // Tlačidlo komplexnej obnovy (overí internetový čas aj počasie)
        document.getElementById('refreshAll').addEventListener('click', () => {
            fetchNetworkTime();
            fetchWeather();
        });

        function changeColor(hex) {
            document.documentElement.style.setProperty('--accent-color', hex);
            document.documentElement.style.setProperty('--accent-glow', hex + '66');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Chyba pri zapnutí Fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        let idleTimer;
        function resetIdleTimer() {
            document.body.classList.remove('hide-ui');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                document.body.classList.add('hide-ui');
            }, 4000);
        }

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('click', resetIdleTimer);
        window.addEventListener('touchstart', resetIdleTimer);
        resetIdleTimer();
    </script>
</body>
</html>
