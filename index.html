<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligentné Nástenné Hodiny - Bratislava</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.4);
            --bg-color: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            opacity: 1;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        body.hide-ui .top-bar,
        body.hide-ui .bottom-bar {
            opacity: 0;
            pointer-events: none;
        }

        .location-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #aaa;
        }

        .location-info span {
            color: #fff;
            font-weight: 600;
        }

        .time-source-badge {
            font-size: 0.75rem;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button, select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
            outline: none;
        }

        button:hover, select:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        select option {
            background: #111;
            color: #fff;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-grow: 1;
            width: 100%;
        }

        /* Hodiny s pevnými slotmi pre znaky, aby sa neprekrývali ani neposkakovali */
        .clock-container {
            font-family: 'Orbitron', sans-serif;
            font-size: 14vw;
            font-weight: 900;
            line-height: 1;
            color: var(--accent-color);
            text-shadow: 0 0 30px var(--accent-glow), 0 0 60px var(--accent-glow);
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .time-group {
            display: inline-flex;
        }

        .digit {
            display: inline-block;
            text-align: center;
            font-variant-numeric: tabular-nums;
            min-width: 0.65em; /* Zabezpečuje rovnaký priestor pre každú číslicu bez prekrývania */
        }

        .separator {
            display: inline-block;
            text-align: center;
            min-width: 0.3em;
        }

        .seconds {
            font-size: 6vw;
            opacity: 0.7;
            vertical-align: super;
            margin-left: 15px;
            display: inline-flex;
            align-items: flex-start;
        }

        .date-container {
            font-size: 2rem;
            font-weight: 500;
            color: #ccc;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: capitalize;
        }

        .weather-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .weather-icon {
            font-size: 3rem;
        }

        .weather-details {
            text-align: left;
        }

        .temp {
            font-size: 2.2rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-color);
            font-variant-numeric: tabular-nums;
        }

        .condition {
            font-size: 0.95rem;
            color: #aaa;
        }

        .bottom-bar {
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        @media (max-width: 768px) {
            .clock-container { font-size: 17vw; }
            .seconds { font-size: 7vw; margin-left: 8px; }
            .date-container { font-size: 1.2rem; }
            .top-bar { padding: 10px 15px; flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body id="body">

    <div class="top-bar">
        <div class="location-info">
            📍 <span>Bratislava - mesto</span>
            <div class="time-source-badge" id="timeBadge">🌐 Stabilný Čas</div>
        </div>
        <div class="controls">
            <button id="refreshAll" title="Obnoviť dáta">🔄 Obnoviť</button>
            <select id="colorPicker" onchange="changeColor(this.value)">
                <option value="#ffffff">Biela (Predvolená)</option>
                <option value="#3b82f6">Neónová Modrá</option>
                <option value="#10b981">Svetlá Zelená</option>
                <option value="#f59e0b">Jantárová</option>
                <option value="#ec4899">Ružová</option>
            </select>
            <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
    </div>

    <div class="main-container">
        <!-- Rozdelené do bezpečných pevných blokov, ktoré zabránia prekrývaniu -->
        <div class="clock-container">
            <span class="time-group">
                <span class="digit" id="h1">0</span><span class="digit" id="h2">0</span>
            </span>
            <span class="separator">:</span>
            <span class="time-group">
                <span class="digit" id="m1">0</span><span class="digit" id="m2">0</span>
            </span>
            <span class="seconds">
                <span class="digit" id="s1">0</span><span class="digit" id="s2">0</span>
            </span>
        </div>
        
        <div class="date-container" id="date">
            Načítavam dátum...
        </div>

        <div class="weather-card">
            <div class="weather-icon" id="wIcon">🌡️</div>
            <div class="weather-details">
                <div class="temp" id="wTemp">--°C</div>
                <div class="condition" id="wDesc">Načítavam počasie...</div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        Stabilný ciferník + Internetový čas + Open-Meteo počasie
    </div>

    <script>
        const LAT = 48.1486;
        const LON = 17.1077;

        let timeOffset = 0;

        async function syncInternetTime() {
            try {
                const response = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=Europe/Bratislava');
                if (!response.ok) throw new Error('API nedostupné');
                const data = await response.json();
                
                const serverTime = new Date(data.dateTime).getTime();
                const localTime = new Date().getTime();
                timeOffset = serverTime - localTime;
                
                document.getElementById('timeBadge').textContent = "🌐 Online NTP Čas";
            } catch (e1) {
                try {
                    const res = await fetch(window.location.href, { method: 'HEAD' });
                    const dateHeader = res.headers.get('Date');
                    if (dateHeader) {
                        const serverTime = new Date(dateHeader).getTime();
                        const localTime = new Date().getTime();
                        timeOffset = serverTime - localTime;
                        document.getElementById('timeBadge').textContent = "🌐 Serverový Čas";
                    }
                } catch (e2) {
                    document.getElementById('timeBadge').textContent = "⚠️ Záložný čas";
                }
            }
        }

        function updateClock() {
            const currentInternetTime = new Date(new Date().getTime() + timeOffset);
            
            let hours = String(currentInternetTime.getHours()).padStart(2, '0');
            let minutes = String(currentInternetTime.getMinutes()).padStart(2, '0');
            let seconds = String(currentInternetTime.getSeconds()).padStart(2, '0');

            // Vloženie každej číslice do jej vlastného bezpečného kontajnera
            document.getElementById('h1').textContent = hours[0];
            document.getElementById('h2').textContent = hours[1];
            document.getElementById('m1').textContent = minutes[0];
            document.getElementById('m2').textContent = minutes[1];
            document.getElementById('s1').textContent = seconds[0];
            document.getElementById('s2').textContent = seconds[1];

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = currentInternetTime.toLocaleDateString('sk-SK', options);
        }

        updateClock();
        setInterval(updateClock, 1000);

        syncInternetTime();
        setInterval(syncInternetTime, 5 * 60 * 1000);

        async function fetchWeather() {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Europe/Bratislava`);
                if (!response.ok) throw new Error('Chyba siete');
                
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const humidity = data.current.relative_humidity_2m;
                const code = data.current.weather_code;

                document.getElementById('wTemp').textContent = `${temp}°C`;
                
                let desc = "Jasno";
                let icon = "☀️";
                
                if (code >= 1 && code <= 3) { desc = "Polooblačno až oblačno"; icon = "⛅"; }
                else if (code >= 45 && code <= 48) { desc = "Hmla"; icon = "🌫️"; }
                else if (code >= 51 && code <= 67) { desc = "Dážď / Prehánky"; icon = "🌧️"; }
                else if (code >= 71 && code <= 77) { desc = "Sneh"; icon = "❄️"; }
                else if (code >= 95) { desc = "Búrka"; icon = "⛈️"; }

                document.getElementById('wDesc').textContent = `${desc} (Vlhkosť: ${humidity}%)`;
                document.getElementById('wIcon').textContent = icon;
            } catch (error) {
                console.error("Chyba pri načítaní počasia:", error);
                document.getElementById('wDesc').textContent = "Nepodarilo sa načítať počasie";
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 10 * 60 * 1000);

        document.getElementById('refreshAll').addEventListener('click', () => {
            syncInternetTime();
            fetchWeather();
        });

        function changeColor(hex) {
            document.documentElement.style.setProperty('--accent-color', hex);
            document.documentElement.style.setProperty('--accent-glow', hex + '66');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Chyba pri zapnutí Fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        let idleTimer;
        function resetIdleTimer() {
            document.body.classList.remove('hide-ui');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                document.body.classList.add('hide-ui');
            }, 4000);
        }

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('click', resetIdleTimer);
        window.addEventListener('touchstart', resetIdleTimer);
        resetIdleTimer();
    </script>
</body>
</html>
